[project]
name = "bcb-sgs-fetcher"
version = "0.9.0"
description = "Fetcher for BCB SGS (Sistema Gerenciador de Séries Temporais)"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "bcb",
    "sgs",
    "series-temporais",
    "brazil",
    "open-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx2>=2.12.0",
    "lxml>=5.0",
    "markdownify>=0.13",
    "quantilica-core>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/Quantilica/bcb-sgs-fetcher"
Repository = "https://github.com/Quantilica/bcb-sgs-fetcher"
Issues = "https://github.com/Quantilica/bcb-sgs-fetcher/issues"

[project.scripts]
bcb-sgs-fetcher = "bcb_sgs_fetcher.cli:main"

[project.entry-points."quantilica.fetchers"]
bcb-sgs = "bcb_sgs_fetcher.plugin:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# HTML fixtures embedded as string literals exceed the line length
"tests/test_reader.py" = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/bcb_sgs_fetcher"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
